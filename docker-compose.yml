# Site-specific settings live in .env (copy .env.example), and site-specific
# mounts in docker-compose.override.yml, so this file never needs local
# edits and `git pull` stays clean.
services:
  sipbxgo:
    build: .
    image: ghcr.io/justsparx/sipbxgo:latest
    restart: unless-stopped
    # Host networking: SIP needs the real source address of each phone for
    # NAT traversal, and media (RTP) uses a wide UDP port range that
    # Docker's port publishing handles poorly.
    network_mode: host
    environment:
      SIPBX_PUBLIC_IP: "${SIPBX_PUBLIC_IP:-}"
      SIPBX_SIP_DOMAIN: "${SIPBX_DOMAIN:-}"
      SIPBX_SIP_ADDR: ":${SIPBX_SIP_PORT:-5060}"
      SIPBX_RTP_PORTS: "${SIPBX_RTP_PORTS:-10000-10999}"
      # 172.17.0.1 is the host's address on Docker's default bridge:
      # reachable by a reverse proxy container, not from the internet.
      SIPBX_HTTP_ADDR: "${SIPBX_HTTP_ADDR:-172.17.0.1:8080}"
      SIPBX_TRUSTED_NETS: "${SIPBX_TRUSTED_NETS:-}"
      # SIP over TLS (encrypted calls). Needs a certificate: see
      # docker-compose.override.example.yml for sharing Traefik's.
      SIPBX_TLS_ADDR: ":${SIPBX_TLS_PORT:-5061}"
      SIPBX_TLS_ACME_JSON: "${SIPBX_TLS_ACME_JSON:-}"
      SIPBX_TLS_CERT: "${SIPBX_TLS_CERT:-}"
      SIPBX_TLS_KEY: "${SIPBX_TLS_KEY:-}"
      SIPBX_HOLD_MUSIC: "${SIPBX_HOLD_MUSIC:-builtin}"
      SIPBX_LOG_LEVEL: "${SIPBX_LOG_LEVEL:-info}"
      TZ: "${TZ:-UTC}"
    volumes:
      - sipbxgo-data:/data
    # Traefik routing for the web UI. Traefik reaches host-network containers
    # via host.docker.internal, so the Traefik service itself needs:
    #   extra_hosts: ["host.docker.internal:host-gateway"]
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.sipbxgo.rule=Host(`${SIPBX_DOMAIN:-pbx.example.com}`)"
      - "traefik.http.routers.sipbxgo.entrypoints=websecure"
      - "traefik.http.routers.sipbxgo.tls.certresolver=letsencrypt"
      - "traefik.http.services.sipbxgo.loadbalancer.server.port=8080"

volumes:
  sipbxgo-data:
